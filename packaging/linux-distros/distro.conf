# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh, in-container.sh and packaging/arch/aur.sh.

NAME=chip8
APP_NAME=chip8               # AppImage file name
GITHUB_REPO=Dhiva-Labs/chip8
TAG_PREFIX=v                 # release tags are v1.2.3
SUMMARY='CHIP-8 interpreter with an SDL2 frontend'
DESCRIPTION='A CHIP-8 interpreter in C++20 with an SDL2 window, beeper and keypad mapping, validated against the Timendus chip8-test-suite. Run it with a ROM: chip8 game.ch8.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/chip8
# The repository has no license file yet. NOASSERTION is the SPDX value for
# "no license stated"; change it (and set LICENSE_FILE) once it has one.
LICENSE=NOASSERTION
LICENSE_FILE=

# rpm: shared-library dependencies (SDL2, libstdc++) are worked out from the
# ELF file. chip8 runs no other programs.
RPM_REQUIRES=()
# Arch: sdl2 is provided by sdl2-compat on current Arch.
ARCH_DEPENDS=(sdl2 gcc-libs glibc)
ARCH_INDEPENDENT=0

# AppImage: SDL2 comes from the host, like GTK does for GTK AppImages
# (APPIMAGE_HOST_PKGS is what the Fedora check installs as "the host").
APPIMAGE=1
EXEC=usr/bin/chip8
DESKTOP=usr/share/applications/chip8.desktop
ICON=usr/share/icons/hicolor/256x256/apps/chip8.png
APPRUN_ENV=''
APPIMAGE_HOST_PKGS=('libSDL2-2.0.so.0()(64bit)')

# Smoke tests, run in each distribution container by in-container.sh as shell
# commands (for the AppImage, `chip8` is the AppImage). /smoke holds the
# Timendus test ROMs (tests/roms/fetch_roms.sh, mounted by verify.sh).
# GUI: the real X11 window under Xvfb, still running after SMOKE_SECONDS.
GUI_CMD='chip8 --mute /smoke/2-ibm-logo.ch8'
SMOKE_SECONDS=20
# CLI: the repository's own frontend smoke test (tests/run_tests.sh): SDL's
# dummy video and audio drivers, 180 frames, then a BMP screenshot.
SMOKE_CMD='SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy chip8 --scale 1 --frames 180 --screenshot /tmp/frontend.bmp /smoke/2-ibm-logo.ch8 && test "$(wc -c < /tmp/frontend.bmp)" -gt 8000'
